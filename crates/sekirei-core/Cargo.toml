[package]
name = "sekirei-core"
version = "0.5.2"
edition = "2024"
description = "Shogi engine core library — speculative parallel search and NNUE-style evaluation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/sekirei"

[dependencies]
rayon = "1"
web-time = "1.1"

[features]
# Search constants become run-time settable (USI options T_<NAME>) for
# self-play tuning. Never enabled in release builds.
tune = []
# Opt-in Finny CPU experiment without enabling runtime tuning atomics.
nnue_finny_inplace = []
# Opt-in exact SEE CPU experiment: value-group least-attacker selection.
see_lva_groups = []
# Opt-in CPU experiment: avoid history reads unused by late move reduction.
lmr_stat_lazy = []
# Opt-in ProbCut SEE comparison bound, without runtime tuning atomics.
probcut_see_bound = []
# Opt-in CPU experiment: two bits in the existing repetition Bloom filter.
# A compile-time mode prevents mixed filter rules during an active search.
repetition_filter2 = []
# Opt-in CPU experiment: expand the ordered non-pawn correction-key fold.
correction_key_unroll = []
# Opt-in CPU experiment: reuse the existing correction pawn key in V2.
pawn_key_reuse = []
king_relative_b_small = []
nnue_l1_384 = []
nnue_l1_128 = []
nnue_l2_64 = []
nnue_l2_16 = []

[lib]
name = "sekirei_core"

[[bin]]
name = "sekirei-search-diagnostic"
path = "src/bin/search_diagnostic.rs"

[[bin]]
name = "sekirei-position-classifier"
path = "src/bin/position_classifier.rs"

[[bin]]
name = "sekirei-legal-moves"
path = "src/bin/legal_moves.rs"

[[bin]]
name = "sekirei-rule-probe"
path = "src/bin/rule_probe.rs"

[lints.rust]
missing_docs = "warn"
