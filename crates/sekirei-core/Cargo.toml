[package]
name = "sekirei-core"
version = "0.3.48"
edition = "2024"
description = "Shogi engine core library — speculative parallel search and NNUE-style evaluation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/sekirei"

[dependencies]
rayon = "1"

[features]
king_relative_b_small = []
nnue_l1_384 = []
nnue_l1_128 = []
nnue_l2_64 = []
nnue_l2_16 = []

[lib]
name = "sekirei_core"

[[bin]]
name = "sekirei-search-diagnostic"
path = "src/bin/search_diagnostic.rs"

[[bin]]
name = "sekirei-position-classifier"
path = "src/bin/position_classifier.rs"

[[bin]]
name = "sekirei-legal-moves"
path = "src/bin/legal_moves.rs"

[[bin]]
name = "sekirei-rule-probe"
path = "src/bin/rule_probe.rs"

[lints.rust]
missing_docs = "warn"
