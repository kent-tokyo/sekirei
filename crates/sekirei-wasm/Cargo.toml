[package]
name = "sekirei-wasm"
version = "0.3.67"
edition = "2024"
description = "Browser-safe WebAssembly API for the Sekirei shogi engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/sekirei"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
sekirei-core = { path = "../sekirei-core", version = "0.3.67" }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
missing_docs = "warn"
