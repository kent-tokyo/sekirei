[package]
name = "sekirei-bench"
version = "0.3.36"
edition = "2024"
description = "Benchmarks for the Sekirei shogi engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/sekirei"

[dependencies]
sekirei-core = { path = "../sekirei-core", version = "0.3.36" }
rayon = "1"
rsshogi = { version = "1.2.3", git = "https://github.com/nyoki-mtl/rsshogi.git", rev = "a1dbc020e0711574ba0bec6a7b123c411ccdd625" }
shogi_core = "0.1.5"
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "movegen"
harness = false

[[bin]]
name = "sync_overhead"
path = "src/bin/sync_overhead.rs"

[[bin]]
name = "nnue_probe"
path = "src/bin/nnue_probe.rs"

[[bin]]
name = "cross_library"
path = "src/bin/cross_library.rs"
