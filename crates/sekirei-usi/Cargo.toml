[package]
name = "sekirei"
version = "0.3.3"
edition = "2024"
description = "USI shogi engine binary (Sekirei)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/sekirei"

[[bin]]
name = "sekirei"
path = "src/main.rs"

[dependencies]
sekirei-core = { path = "../sekirei-core", version = "0.3.3" }
rayon = "1"
lineprior = "0.10.0"

[features]
# Forward to sekirei-core; see that crate's Cargo.toml / nnue.rs module doc.
king_relative_b_small = ["sekirei-core/king_relative_b_small"]
