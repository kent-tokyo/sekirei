[package]
name = "sekirei"
version = "0.3.0"
edition = "2024"
description = "USI shogi engine binary (Sekirei)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/sekirei"

[[bin]]
name = "sekirei"
path = "src/main.rs"

[dependencies]
sekirei-core = { path = "../sekirei-core", version = "0.3.0" }
rayon = "1"
lineprior = { git = "https://github.com/kent-tokyo/lineprior", tag = "v0.9.0" }
