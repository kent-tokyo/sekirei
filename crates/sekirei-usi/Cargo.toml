[package]
name = "sekirei"
version = "0.5.1"
edition = "2024"
description = "USI shogi engine binary (Sekirei)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/sekirei"

[[bin]]
name = "sekirei"
path = "src/main.rs"

[dependencies]
sekirei-core = { path = "../sekirei-core", version = "0.5.1" }
rayon = "1"
lineprior = { version = "0.12.6", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }

[features]
default = []
opening-book = ["dep:lineprior", "dep:serde", "dep:serde_json", "dep:sha2"]
tune = ["sekirei-core/tune"]
nnue_finny_inplace = ["sekirei-core/nnue_finny_inplace"]
see_lva_groups = ["sekirei-core/see_lva_groups"]
probcut_see_bound = ["sekirei-core/probcut_see_bound"]
repetition_filter2 = ["sekirei-core/repetition_filter2"]
correction_key_unroll = ["sekirei-core/correction_key_unroll"]
pawn_key_reuse = ["sekirei-core/pawn_key_reuse"]
king_relative_b_small = ["sekirei-core/king_relative_b_small"]
nnue_l1_384 = ["sekirei-core/nnue_l1_384"]
nnue_l1_128 = ["sekirei-core/nnue_l1_128"]
nnue_l2_64 = ["sekirei-core/nnue_l2_64"]
nnue_l2_16 = ["sekirei-core/nnue_l2_16"]

[dev-dependencies]
tempfile = "3"
