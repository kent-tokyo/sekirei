[package]
name = "sekirei-train"
version = "0.4.3"
edition = "2024"
description = "NNUE training pipeline for the Sekirei shogi engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/sekirei"
default-run = "train"

[[bin]]
name = "train"
path = "src/main.rs"

[[bin]]
name = "verify-shogiesa-label-run"
path = "src/bin/verify_shogiesa_label_run.rs"

[dependencies]
sekirei-core = { path = "../sekirei-core", version = "0.4.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
lineprior = "0.12.6"
shogiesa-core = "0.11.6"
tempfile = "3"
flate2 = { version = "=1.1.10", optional = true, default-features = false, features = ["miniz_oxide"] }
ruzstd = { version = "=0.9.1", optional = true, default-features = false, features = ["std", "hash"] }

[features]
positions-gzip = ["dep:flate2"]
positions-zstd = ["dep:ruzstd"]
king_relative_b_small = ["sekirei-core/king_relative_b_small"]
nnue_l1_384 = ["sekirei-core/nnue_l1_384"]
nnue_l1_128 = ["sekirei-core/nnue_l1_128"]
nnue_l2_64 = ["sekirei-core/nnue_l2_64"]
nnue_l2_16 = ["sekirei-core/nnue_l2_16"]
