coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      rust-engine:
        target: 90%
        threshold: 0%
        if_ci_failed: error
        flags:
          - rust-engine
    patch:
      rust-engine:
        target: 90%
        threshold: 0%
        if_ci_failed: error
        flags:
          - rust-engine

flags:
  rust-engine:
    carryforward: false

# This is the same engine/library contract enforced by
# scripts/check_rust_coverage.sh. CLI and benchmark paths remain covered by
# ordinary tests and can be reported separately without changing the badge.
ignore:
  - "crates/sekirei-bench/"
  - "crates/sekirei-core/src/bin/"
  - "crates/sekirei-csa/src/bin/"
  - "crates/sekirei-train/src/bin/"
  - "crates/sekirei-csa/src/main.rs"
  - "crates/sekirei-match-runner/src/main.rs"
  - "crates/sekirei-train/src/main.rs"

comment: false
