name: Coverage

on:
  # Not on pull_request: coverage runs after merge to main (user decision
  # 2026-11-28) to free runner slots for PR CI.
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# A newer push to the same PR or branch makes the older run obsolete. Cancel it
# so it stops holding hosted-runner slots; runs queue behind each other
# otherwise (2026-11-28: PR runs waited up to an hour before starting).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep hosted runners independent of the local target-cpu=native setting.
  RUSTFLAGS: ""

jobs:
  rust-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Keep the 98% line gate comparable with its verified baseline.
          toolchain: 1.99.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Rust engine/library coverage (minimum 98%)
        run: bash scripts/check_rust_coverage.sh
      - name: Upload coverage artifact
        if: always() && hashFiles('target/coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rust-engine-coverage
          path: |
            target/coverage/lcov.info
            target/coverage/summary.json
            target/coverage/full-workspace-summary.json
            target/coverage/tuned-search-summary.json
            target/coverage/tuned-public-path-summary.json
            target/coverage/trainer-smoke-summary.json
            target/coverage/wasm-native-contract-summary.json
          if-no-files-found: error
      - name: codecov-upload
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        uses: codecov/codecov-action@v5
        with:
          files: target/coverage/lcov.info
          flags: rust-engine
          fail_ci_if_error: true
          use_oidc: true
