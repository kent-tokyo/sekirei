name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact release tag to publish, e.g. v0.3.1"
        required: true
        default: v0.3.1
      crates:
        description: >-
          Comma-separated crate names to publish. Allowed: sekirei-core,
          sekirei-bench, sekirei-csa, sekirei-match-runner, sekirei-train,
          sekirei. Publish order (core first) is enforced regardless of
          input order. All six workspace crates are publishable from the
          registry after the dependency order is respected.
        required: true
        default: sekirei-core
      dry_run:
        description: "Dry run only (recommended for first use of a crate) -- validates packaging without publishing, never requests a crates.io token"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Optional extra gate: create an environment named "crates-io" under
    # Settings -> Environments with required reviewers to force a manual
    # approval click before this job runs. No effect if left unconfigured.
    # If used, this same environment name must also be entered in each
    # crate's Trusted Publisher config on crates.io.
    environment: crates-io
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      # .cargo/config.toml sets -C target-cpu=native for local release
      # builds; overridden empty here because GitHub-hosted runners aren't
      # guaranteed identical hardware and native codegen has crashed rustc
      # with SIGILL on this fleet (see ci.yml's identical override for the
      # incident). cargo publish's own verify-build step runs the same
      # compile, so this workflow needs the same protection.
      RUSTFLAGS: ""
      # The token is injected only into non-dry-run publish steps from the
      # repository secret; its value is never printed. All six crates use the
      # same explicitly configured CARGO_REGISTRY_TOKEN path.
    steps:
      - name: Validate release_tag format
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag '$RELEASE_TAG' does not match ^v[0-9]+\.[0-9]+\.[0-9]+\$"
            exit 1
          fi
          echo "release_tag OK: $RELEASE_TAG"

      - name: Validate crates input
        env:
          CRATES_INPUT: ${{ inputs.crates }}
        run: |
          python3 - <<'PYEOF'
          import os, sys

          allowed = {
              "sekirei-core", "sekirei-bench", "sekirei-csa",
              "sekirei-match-runner", "sekirei-train", "sekirei",
          }
          raw = os.environ["CRATES_INPUT"]
          # str.split(",") deliberately used over a shell split -- it keeps
          # empty fields from a leading/trailing/doubled comma instead of
          # silently dropping them (bash's `read -ra ... <<<` drops a
          # trailing empty field at EOF, which would let "sekirei-core,"
          # through unnoticed).
          parts = [p.strip() for p in raw.split(",")]

          if parts == [""]:
              print("::error::crates input is empty")
              sys.exit(1)

          seen = []
          for name in parts:
              if not name:
                  print(f"::error::crates input contains an empty entry (check for stray commas): '{raw}'")
                  sys.exit(1)
              if name not in allowed:
                  print(f"::error::unknown crate '{name}' in crates input. Allowed: {sorted(allowed)}")
                  sys.exit(1)
              if name in seen:
                  print(f"::error::duplicate crate '{name}' in crates input: '{raw}'")
                  sys.exit(1)
              seen.append(name)

          print(f"crates input OK: {seen}")
          PYEOF

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify Cargo.toml version matches release_tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CRATES_INPUT: ${{ inputs.crates }}
        run: |
          python3 - <<'PYEOF'
          import os, sys, tomllib

          release_tag = os.environ["RELEASE_TAG"]
          expected_version = release_tag[1:]  # strip leading "v" -- format already validated
          requested = [c.strip() for c in os.environ["CRATES_INPUT"].split(",") if c.strip()]

          manifest_for = {
              "sekirei-core": "crates/sekirei-core/Cargo.toml",
              "sekirei-bench": "crates/sekirei-bench/Cargo.toml",
              "sekirei-csa": "crates/sekirei-csa/Cargo.toml",
              "sekirei-match-runner": "crates/sekirei-match-runner/Cargo.toml",
              "sekirei-train": "crates/sekirei-train/Cargo.toml",
              "sekirei": "crates/sekirei-usi/Cargo.toml",
          }

          mismatches = []
          for name, path in manifest_for.items():
              with open(path, "rb") as f:
                  actual_version = tomllib.load(f)["package"]["version"]
              if actual_version != expected_version:
                  mismatches.append(f"{name} ({path}): expected {expected_version}, found {actual_version}")

          if mismatches:
              print("::error::VERSION_TAG_MISMATCH: " + "; ".join(mismatches))
              sys.exit(1)

          with open("Cargo.lock", "rb") as f:
              lock_packages = {
                  package["name"]: package["version"]
                  for package in tomllib.load(f).get("package", [])
                  if package["name"] in manifest_for
              }
          lock_mismatches = [
              f"{name} (Cargo.lock): expected {expected_version}, found {lock_packages.get(name, '<missing>')}"
              for name in manifest_for
              if lock_packages.get(name) != expected_version
          ]
          if lock_mismatches:
              print("::error::VERSION_TAG_MISMATCH: " + "; ".join(lock_mismatches))
              sys.exit(1)

          print(f"All workspace crates and Cargo.lock entries match version {expected_version}")
          PYEOF

      - name: Show requested crates and mode
        env:
          CRATES_INPUT: ${{ inputs.crates }}
        run: |
          echo "Requested: $CRATES_INPUT"
          echo "Dry run: $DRY_RUN"

      # sekirei-core must publish (or already be published at this version)
      # before any of the other 5, which depend on it via a path+version dep.
      - name: Dry-run publish sekirei-core
        if: ${{ contains(format(',{0},', inputs.crates), ',sekirei-core,') && inputs.dry_run }}
        run: cargo publish -p sekirei-core --dry-run

      - name: Publish sekirei-core
        if: ${{ contains(format(',{0},', inputs.crates), ',sekirei-core,') && !inputs.dry_run }}
        run: cargo publish -p sekirei-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for sekirei-core to index on crates.io
        if: ${{ contains(format(',{0},', inputs.crates), ',sekirei-core,') && !inputs.dry_run }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          echo "Polling sparse index for sekirei-core $expected_version (every 10s, max 3m)..."
          for i in $(seq 1 18); do
            if curl -fsS "https://index.crates.io/se/ki/sekirei-core" 2>/dev/null | grep -q "\"vers\":\"$expected_version\""; then
              echo "sekirei-core $expected_version is indexed."
              exit 0
            fi
            sleep 10
          done
          echo "::error::timed out after 3m waiting for sekirei-core $expected_version to appear in the crates.io sparse index -- refusing to publish dependent crates"
          exit 1

      - name: Dry-run publish sekirei-bench
        if: ${{ contains(format(',{0},', inputs.crates), ',sekirei-bench,') && inputs.dry_run }}
        run: cargo publish -p sekirei-bench --dry-run

      - name: Publish sekirei-bench
        if: ${{ contains(format(',{0},', inputs.crates), ',sekirei-bench,') && !inputs.dry_run }}
        run: cargo publish -p sekirei-bench
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Dry-run publish sekirei-csa
        if: ${{ contains(format(',{0},', inputs.crates), ',sekirei-csa,') && inputs.dry_run }}
        run: cargo publish -p sekirei-csa --dry-run

      - name: Publish sekirei-csa
        if: ${{ contains(format(',{0},', inputs.crates), ',sekirei-csa,') && !inputs.dry_run }}
        run: cargo publish -p sekirei-csa
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Dry-run publish sekirei-match-runner
        if: ${{ contains(format(',{0},', inputs.crates), ',sekirei-match-runner,') && inputs.dry_run }}
        run: cargo publish -p sekirei-match-runner --dry-run

      - name: Publish sekirei-match-runner
        if: ${{ contains(format(',{0},', inputs.crates), ',sekirei-match-runner,') && !inputs.dry_run }}
        run: cargo publish -p sekirei-match-runner
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Dry-run publish sekirei-train
        if: ${{ contains(format(',{0},', inputs.crates), ',sekirei-train,') && inputs.dry_run }}
        run: cargo publish -p sekirei-train --dry-run

      - name: Publish sekirei-train
        if: ${{ contains(format(',{0},', inputs.crates), ',sekirei-train,') && !inputs.dry_run }}
        run: cargo publish -p sekirei-train
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Package name "sekirei", crate directory crates/sekirei-usi.
      - name: Dry-run publish sekirei (sekirei-usi)
        if: ${{ contains(format(',{0},', inputs.crates), ',sekirei,') && inputs.dry_run }}
        run: cargo publish -p sekirei --dry-run

      - name: Publish sekirei (sekirei-usi)
        if: ${{ contains(format(',{0},', inputs.crates), ',sekirei,') && !inputs.dry_run }}
        run: cargo publish -p sekirei
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
