name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # .cargo/config.toml sets -C target-cpu=native, intentional for local
  # release builds tuned to a known machine. GitHub-hosted runners are not
  # guaranteed identical hardware between runs, and native feature
  # detection has been observed to advertise instructions the runner's
  # virtualized CPU doesn't actually execute correctly -- rustc itself
  # crashed with SIGILL compiling a proc-macro dependency this way (PR #27's
  # smoke job, reproduced on rerun, not a one-off). This RUSTFLAGS override
  # takes precedence over the config file for every job in this workflow,
  # without touching the local/release-build setting.
  RUSTFLAGS: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: doc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: test
        run: cargo test --release
      - name: build
        run: cargo build --release
      - name: release metadata
        run: python3 scripts/check_release_metadata.py
      - name: documentation references
        run: python3 scripts/check_documentation_references.py
      - name: public contract checks
        run: bash scripts/test_public_contracts.sh
      - name: documented training CLI options
        run: |
          cargo run --release -p sekirei-train -- --help > /tmp/sekirei-train-help.txt 2>&1
          grep -q -- '--strict-positions' /tmp/sekirei-train-help.txt
          grep -q -- '--resume-checkpoint' /tmp/sekirei-train-help.txt
          grep -q -- '--resume-checkpoint-every-games' /tmp/sekirei-train-help.txt
      - name: public surface
        run: python3 scripts/check_public_surface.py
      - name: competitor capability audit
        run: python3 scripts/validate_rshogi_capability_audit.py
      - name: NNUE diagnostic tests
        run: |
          python3 scripts/test_nnue_diagnostics.py
          python3 -m unittest scripts/test_check_candidate_readiness.py
      - name: teacher comparison tests
        run: |
          python3 scripts/test_compare_teacher_evals.py
          python3 scripts/test_merge_teacher_caches.py
          python3 scripts/test_summarize_self_distill.py
      - name: release manifest schema
        run: |
          python3 scripts/test_release_manifest.py
          python3 scripts/validate_release_manifest.py scripts/fixtures/release_manifest_diagnostic_v1.json
          python3 scripts/attach_candidate_readiness.py \
            --release-manifest release-manifest-v0.3.29.json \
            --readiness scripts/fixtures/candidate_readiness_v1.json \
            --output /tmp/release-manifest-with-readiness.json
          python3 scripts/validate_release_manifest.py /tmp/release-manifest-with-readiness.json
      - name: analysis record diagnostics
        run: |
          python3 scripts/test_record_floodgate_manifest.py
          python3 scripts/test_finalize_csa_run_manifest.py
          python3 scripts/test_validate_csa_run_manifest.py
          python3 scripts/test_attach_run_manifest_to_analysis.py
          python3 scripts/test_compare_core_evaluator_diagnostics.py
          python3 scripts/test_floodgate_supervisor.py
          python3 scripts/test_floodgate_operation_acceptance.py
          python3 scripts/test_launchd_template.py
          python3 scripts/test_validate_floodgate_runtime_status.py
          python3 scripts/test_build_floodgate_diagnostic_corpus.py
          python3 scripts/test_validate_floodgate_diagnostic_corpus.py
          python3 scripts/test_sfen_symmetry.py
          python3 scripts/verify_floodgate_corpus_symmetry.py \
            --binary target/release/sekirei-search-diagnostic \
            --corpus results/floodgate/20260912-review/diagnostic-corpus-with-controls.json \
            --nodes 64
          python3 scripts/validate_floodgate_diagnostic_corpus.py \
            --verify-sources --root . \
            results/floodgate/20260912-review/diagnostic-corpus-with-controls.json
          python3 scripts/test_run_floodgate_fixed_nodes.py
          python3 scripts/test_run_core_floodgate_diagnostic.py
          python3 scripts/test_validate_floodgate_diagnostic_summary.py
          python3 scripts/test_validate_floodgate_diagnostic_comparison.py
          python3 scripts/test_validate_floodgate_root_review.py
          python3 scripts/test_run_floodgate_root_review.py
          python3 scripts/validate_floodgate_root_review.py \
            scripts/fixtures/floodgate_root_review_v1.json
          python3 scripts/validate_floodgate_root_review.py \
            scripts/fixtures/floodgate_root_review_v2.json
          python3 scripts/test_check_release_metadata.py
          python3 scripts/test_select_completed_diagnostic_rows.py
          python3 scripts/test_validate_completed_diagnostic_selection.py
          python3 scripts/test_compare_floodgate_diagnostic_summaries.py
          python3 scripts/test_compare_floodgate_budget_runs.py
          python3 scripts/test_validate_floodgate_budget_comparison.py
          python3 scripts/test_select_floodgate_hypothesis.py
          python3 scripts/test_validate_floodgate_hypothesis_selection.py
          python3 scripts/test_validate_floodgate_hypothesis_consistency.py
          python3 scripts/test_build_floodgate_hypothesis_table.py
          python3 scripts/test_validate_floodgate_hypothesis_table.py
          python3 scripts/test_split_floodgate_diagnostic_corpus.py
          python3 scripts/test_validate_floodgate_diagnostic_split.py
          python3 scripts/test_attach_diagnostic_artifacts.py
          python3 scripts/test_validate_floodgate_candidate_decision.py
          python3 scripts/test_validate_floodgate_candidate_evidence.py
          python3 scripts/test_assess_floodgate_candidate_holdout_alignment.py
          python3 scripts/test_prepare_floodgate_candidate_holdout_plan.py
          python3 scripts/test_validate_floodgate_candidate_holdout_plan.py
          python3 scripts/validate_floodgate_candidate_decision.py \
            results/floodgate/20260912-review/fg5e-candidate-decision.json
          python3 scripts/test_validate_floodgate_offline_acceptance.py
          python3 scripts/validate_floodgate_offline_acceptance.py \
            results/floodgate/20260912-review/fg2-offline-acceptance-manifest.json
          python3 scripts/test_validate_floodgate_supervisor_events.py
          python3 scripts/test_evaluate_floodgate_diagnostic_gate.py
          python3 scripts/test_build_independent_diagnostic_corpus.py
          python3 scripts/test_compare_floodgate_holdout_runs.py
          python3 scripts/test_validate_floodgate_holdout_comparison.py
          python3 scripts/validate_floodgate_holdout_comparison.py \
            results/floodgate/20260912-review/independent-holdout-depth2/comparison-v2.json
          python3 scripts/test_evaluate_floodgate_holdout_regression.py
          python3 scripts/test_analyze_floodgate_budget_ladder.py
          python3 scripts/test_validate_floodgate_budget_ladder.py
          python3 scripts/test_analyze_floodgate_depth_ladder.py
          python3 scripts/test_validate_floodgate_depth_ladder.py
          python3 -m unittest \
            scripts/test_analysis_record.py \
            scripts/test_analyze_analysis_record.py \
            scripts/test_summarize_analysis_swings.py \
            scripts/test_analyze_floodgate_analysis.py \
            scripts/test_classify_swing_positions.py \
            scripts/test_analyze_eval_gap.py \
            scripts/test_fit_eval_calibration.py
          python3 scripts/validate_analysis_record.py \
            scripts/fixtures/analysis_record_v1.jsonl
          python3 scripts/validate_analysis_record.py \
            scripts/fixtures/analysis_replay_v2.analysis.jsonl
          cargo run --release -p sekirei-csa --bin sekirei-analysis-replay -- \
            scripts/fixtures/analysis_replay_v1.csa \
            scripts/fixtures/analysis_replay_v1.analysis.jsonl
          cargo run --release -p sekirei-csa --bin sekirei-analysis-replay -- \
            scripts/fixtures/analysis_replay_v2.csa \
            scripts/fixtures/analysis_replay_v2.analysis.jsonl
          cargo build -p sekirei-csa
          python3 scripts/test_csa_nnue_startup.py target/debug/sekirei-csa
          python3 scripts/test_floodgate_actual_client_operation.py
      - name: SharedMcts transcript manifest fixture
        run: |
          python3 scripts/record_mcts_transcript.py \
            --release-manifest release-manifest-v0.3.29.json \
            --transcript scripts/fixtures/usi_smoke_shared_mcts_v0.3.29.txt \
            --output /tmp/release-manifest-with-mcts.json
          python3 scripts/validate_release_manifest.py /tmp/release-manifest-with-mcts.json
      - name: SharedMcts binary transcript smoke
        run: |
          cargo build --release -p sekirei
          printf '%s\n' \
            'usi' \
            'setoption name UseBook value false' \
            'setoption name SearchMode value SharedMcts' \
            'position startpos' \
            'go nodes 4 depth 2' \
            'quit' | target/release/sekirei > /tmp/usi-shared-mcts-v0.3.29.txt
          grep -q '^info string shared_mcts ' /tmp/usi-shared-mcts-v0.3.29.txt
          python3 scripts/record_mcts_transcript.py \
            --release-manifest release-manifest-v0.3.29.json \
            --transcript /tmp/usi-shared-mcts-v0.3.29.txt \
            --output /tmp/release-manifest-with-live-mcts.json
          python3 scripts/validate_release_manifest.py /tmp/release-manifest-with-live-mcts.json
          python3 scripts/verify_mcts_diagnostic.py \
            --manifest /tmp/release-manifest-with-live-mcts.json \
            --transcript /tmp/usi-shared-mcts-v0.3.29.txt
      - name: Fixed-budget MCTS diagnostic
        run: |
          cargo run --release -p sekirei-core --example mcts_fixed_budget_diagnostic > /tmp/mcts-fixed-budget-1.txt
          cargo run --release -p sekirei-core --example mcts_fixed_budget_diagnostic > /tmp/mcts-fixed-budget-2.txt
          diff -u /tmp/mcts-fixed-budget-1.txt /tmp/mcts-fixed-budget-2.txt
          test "$(grep -c '^repeat=' /tmp/mcts-fixed-budget-1.txt)" -eq 18
          python3 scripts/record_mcts_comparison.py \
            --release-manifest release-manifest-v0.3.29.json \
            --transcript /tmp/mcts-fixed-budget-1.txt \
            --output /tmp/release-manifest-with-mcts-comparison.json
          python3 scripts/validate_release_manifest.py /tmp/release-manifest-with-mcts-comparison.json
          python3 scripts/summarize_mcts_comparison.py \
            /tmp/release-manifest-with-mcts-comparison.json \
            --output /tmp/mcts-comparison-summary.json
          python3 -m json.tool /tmp/mcts-comparison-summary.json > /dev/null
          cargo run --release -p sekirei-core --example mcts_fixed_budget_diagnostic -- --simulations 8 --max-depth 2 > /tmp/mcts-fixed-budget-small-1.txt
          cargo run --release -p sekirei-core --example mcts_fixed_budget_diagnostic -- --simulations 8 --max-depth 2 > /tmp/mcts-fixed-budget-small-2.txt
          diff -u /tmp/mcts-fixed-budget-small-1.txt /tmp/mcts-fixed-budget-small-2.txt
          test "$(grep -c '^repeat=' /tmp/mcts-fixed-budget-small-1.txt)" -eq 18
          python3 scripts/record_mcts_comparison.py \
            --release-manifest release-manifest-v0.3.29.json \
            --transcript /tmp/mcts-fixed-budget-small-1.txt \
            --output /tmp/release-manifest-with-mcts-comparison-small.json
          python3 scripts/validate_release_manifest.py /tmp/release-manifest-with-mcts-comparison-small.json
          python3 scripts/summarize_mcts_comparison.py \
            /tmp/release-manifest-with-mcts-comparison-small.json \
            --output /tmp/mcts-comparison-summary-small.json
          python3 -m json.tool /tmp/mcts-comparison-summary-small.json > /dev/null
          python3 scripts/aggregate_mcts_summaries.py \
            /tmp/release-manifest-with-mcts-comparison-small.json \
            /tmp/release-manifest-with-mcts-comparison.json \
            --output /tmp/mcts-budget-summary.json
          python3 -m json.tool /tmp/mcts-budget-summary.json > /dev/null
      - name: Upload SharedMcts diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shared-mcts-diagnostic-v0.3.29
          path: |
            /tmp/usi-shared-mcts-v0.3.29.txt
            /tmp/release-manifest-with-live-mcts.json
            /tmp/mcts-fixed-budget-1.txt
            /tmp/release-manifest-with-mcts-comparison.json
            /tmp/mcts-fixed-budget-small-1.txt
            /tmp/release-manifest-with-mcts-comparison-small.json
            /tmp/mcts-comparison-summary.json
            /tmp/mcts-comparison-summary-small.json
            /tmp/mcts-budget-summary.json
          if-no-files-found: error
      - name: resume CLI fixture
        run: bash scripts/test_resume_cli_fixture.sh
      - name: teacher evaluator fixture
        run: bash scripts/test_teacher_eval_fixture.sh
      - name: resume manifest schema
        run: |
          python3 -m unittest scripts/test_record_resume_run.py
          python3 scripts/validate_resume_manifest.py scripts/fixtures/resume_manifest_v1.json
          python3 scripts/attach_resume_manifest.py \
            --release-manifest release-manifest-v0.3.29.json \
            --resume-manifest scripts/fixtures/resume_manifest_v1.json \
            --output /tmp/release-manifest-with-resume.json
          python3 scripts/validate_release_manifest.py /tmp/release-manifest-with-resume.json

  shared-mcts-artifact-audit:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-mcts-diagnostic-v0.3.29
          path: /tmp/shared-mcts-diagnostic
      - name: Verify downloaded SharedMcts diagnostic artifact
        run: |
          python3 scripts/validate_release_manifest.py \
            /tmp/shared-mcts-diagnostic/release-manifest-with-live-mcts.json
          python3 scripts/verify_mcts_diagnostic.py \
            --manifest /tmp/shared-mcts-diagnostic/release-manifest-with-live-mcts.json \
            --transcript /tmp/shared-mcts-diagnostic/usi-shared-mcts-v0.3.29.txt
          test "$(grep -c '^repeat=' /tmp/shared-mcts-diagnostic/mcts-fixed-budget-1.txt)" -eq 18
          test "$(grep -c 'mode=TreeMcts ' /tmp/shared-mcts-diagnostic/mcts-fixed-budget-1.txt)" -eq 9
          test "$(grep -c 'mode=SharedTreeMcts ' /tmp/shared-mcts-diagnostic/mcts-fixed-budget-1.txt)" -eq 9
          grep -q 'transposition_hits=[1-9][0-9]*' /tmp/shared-mcts-diagnostic/mcts-fixed-budget-1.txt
          python3 scripts/validate_release_manifest.py \
            /tmp/shared-mcts-diagnostic/release-manifest-with-mcts-comparison.json
          python3 scripts/validate_release_manifest.py \
            /tmp/shared-mcts-diagnostic/release-manifest-with-mcts-comparison-small.json
          python3 -m json.tool /tmp/shared-mcts-diagnostic/mcts-comparison-summary.json > /dev/null
          python3 -m json.tool /tmp/shared-mcts-diagnostic/mcts-comparison-summary-small.json > /dev/null
          grep -q '"strength_claim": false' /tmp/shared-mcts-diagnostic/mcts-comparison-summary.json
          grep -q '"strength_claim": false' /tmp/shared-mcts-diagnostic/mcts-comparison-summary-small.json
          python3 -m json.tool /tmp/shared-mcts-diagnostic/mcts-budget-summary.json > /dev/null
          grep -q '"strength_claim": false' /tmp/shared-mcts-diagnostic/mcts-budget-summary.json

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: smoke — check README binary crates
        run: |
          cargo check -p sekirei
          cargo check -p sekirei-csa
          cargo check -p sekirei-train
          cargo check -p sekirei-match-runner

  python-tools:
    # Independent job (not a step in `test` above) so a Rust fmt/clippy
    # failure elsewhere can't mask a Python regression here, and vice
    # versa. Only runs this one file, not `unittest discover` across
    # scripts/, so it doesn't sweep in unrelated/WIP test_*.py files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: usi_analysis_export parser unit tests
        run: python3 scripts/test_usi_analysis_export.py

  king-relative-feature:
    # Default-off Cargo feature (crates/sekirei-core/src/nnue.rs's module
    # doc): the `test`/`smoke` jobs above only ever exercise the flag OFF.
    # Without this job, real logic behind the flag (do_move/undo_move's
    # king-move refresh hook, the 20k-input king-relative feature indexing,
    # the SEKIRW02 weight format) would only ever be verified by whoever
    # happens to run it locally -- lighter than the main `test` job
    # (clippy + test only, no doc/build/fmt, since those don't vary by
    # feature) rather than doubling full CI cost for an experimental flag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (king_relative_b_small)
        run: |
          cargo clippy --workspace --all-targets \
            --features sekirei-core/king_relative_b_small,sekirei/king_relative_b_small,sekirei-train/king_relative_b_small \
            -- -D warnings
      - name: test (king_relative_b_small)
        run: |
          cargo test --release -p sekirei-core -p sekirei -p sekirei-train \
            --features sekirei-core/king_relative_b_small,sekirei/king_relative_b_small,sekirei-train/king_relative_b_small
