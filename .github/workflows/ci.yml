name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # .cargo/config.toml sets -C target-cpu=native, intentional for local
  # release builds tuned to a known machine. GitHub-hosted runners are not
  # guaranteed identical hardware between runs, and native feature
  # detection has been observed to advertise instructions the runner's
  # virtualized CPU doesn't actually execute correctly -- rustc itself
  # crashed with SIGILL compiling a proc-macro dependency this way (PR #27's
  # smoke job, reproduced on rerun, not a one-off). This RUSTFLAGS override
  # takes precedence over the config file for every job in this workflow,
  # without touching the local/release-build setting.
  RUSTFLAGS: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: doc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: test
        run: cargo test --release
      - name: build
        run: cargo build --release

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: smoke — check README binary crates
        run: |
          cargo check -p sekirei
          cargo check -p sekirei-csa
          cargo check -p sekirei-train
          cargo check -p sekirei-match-runner

  python-tools:
    # Independent job (not a step in `test` above) so a Rust fmt/clippy
    # failure elsewhere can't mask a Python regression here, and vice
    # versa. Only runs this one file, not `unittest discover` across
    # scripts/, so it doesn't sweep in unrelated/WIP test_*.py files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: usi_analysis_export parser unit tests
        run: python3 scripts/test_usi_analysis_export.py

  king-relative-feature:
    # Default-off Cargo feature (crates/sekirei-core/src/nnue.rs's module
    # doc): the `test`/`smoke` jobs above only ever exercise the flag OFF.
    # Without this job, real logic behind the flag (do_move/undo_move's
    # king-move refresh hook, the 20k-input king-relative feature indexing,
    # the SEKIRW02 weight format) would only ever be verified by whoever
    # happens to run it locally -- lighter than the main `test` job
    # (clippy + test only, no doc/build/fmt, since those don't vary by
    # feature) rather than doubling full CI cost for an experimental flag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (king_relative_b_small)
        run: |
          cargo clippy --workspace --all-targets \
            --features sekirei-core/king_relative_b_small,sekirei/king_relative_b_small,sekirei-train/king_relative_b_small \
            -- -D warnings
      - name: test (king_relative_b_small)
        run: |
          cargo test --release -p sekirei-core -p sekirei -p sekirei-train \
            --features sekirei-core/king_relative_b_small,sekirei/king_relative_b_small,sekirei-train/king_relative_b_small
