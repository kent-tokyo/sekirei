# Remote fixed-depth A/B gate. See scripts/run_fixed_depth_ab.py's module
# docstring and docs/experiments/gate_redesign_low_load.md §5A for the full
# design rationale (moves fixed-depth base/candidate comparison off a
# resource-contended local host onto a GitHub-hosted runner).
#
# manual dispatch only -- never runs on push/pull_request, and never plays
# an engine-vs-engine game (no byoyomi match, no Elo/SPRT, no formal gate).
# Every position is driven at a single fixed search depth, once per binary,
# via direct USI stdin/stdout -- nothing here spawns sekirei-match or any
# multi-game runner.
#
# Security note: every workflow_dispatch input is passed to shell steps via
# `env:` and referenced as a shell variable (e.g. "$BASE_SHA"), never
# interpolated directly into a `run:` script via `${{ inputs.* }}` -- this
# avoids shell/command injection from a crafted input value, even though
# workflow_dispatch is already restricted to users with write access.
name: Fixed-depth A/B gate

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Base commit SHA (or ref) to build and run"
        required: true
        default: "main"
      candidate_sha:
        description: "Candidate commit SHA (or ref) to build and run"
        required: true
      depth:
        description: "Fixed search depth (go depth N) for every position"
        required: false
        default: "9"
      threads:
        description: "USI Threads= value for both binaries"
        required: false
        default: "1"
      spec_top_n:
        description: "USI SpecTopN= value for both binaries (ignored by binaries built before issue #9's option existed)"
        required: false
        default: "3"
      corpus_path:
        description: "Path (relative to repo root, resolved from THIS workflow's own checkout, not base/candidate) to the position corpus JSON"
        required: false
        default: "scripts/fixed_depth_corpus.json"
      candidate_pr:
        description: "Optional: PR number this candidate_sha belongs to, recorded in metadata.json for provenance only"
        required: false
        default: ""
      allow_non_ancestor:
        description: "Set true to allow candidate_sha that does NOT have base_sha as an ancestor (e.g. deliberately comparing two independent commits). Default false rejects a candidate built from a stale/diverged base, which produced a bogus 238x node-ratio outlier in run 31362228815 (candidate predated base's SpecTopN USI option, so setoption SpecTopN=0 was silently ignored)."
        required: false
        default: "false"
      repeats:
        description: "1 (default) runs the normal single-shot base-vs-candidate compare. >1 switches to repeatability mode: each binary is run through the corpus this many times, reporting WITHIN-binary variance (base vs candidate independently) instead of a single-shot diff -- required at spec_top_n>0, where SpeculativeSearcher's own thread pool makes a single-shot compare indistinguishable from noise (see docs/experiments/fixed_depth_gate_run_index.md)."
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  fixed-depth-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA_INPUT: ${{ inputs.base_sha }}
      CANDIDATE_SHA_INPUT: ${{ inputs.candidate_sha }}
      DEPTH: ${{ inputs.depth }}
      THREADS: ${{ inputs.threads }}
      SPEC_TOP_N: ${{ inputs.spec_top_n }}
      CORPUS_PATH: ${{ inputs.corpus_path }}
      CANDIDATE_PR: ${{ inputs.candidate_pr }}
      ALLOW_NON_ANCESTOR: ${{ inputs.allow_non_ancestor }}
      REPEATS: ${{ inputs.repeats }}
      RUN_ID: ${{ github.run_id }}
      GATE_TOOLING_SHA: ${{ github.sha }}
    steps:
      - name: Checkout (full history, for base/candidate worktrees)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branches
        # actions/checkout with fetch-depth:0 unshallows only the ref that
        # triggered this run -- base_sha/candidate_sha commonly belong to a
        # DIFFERENT branch (e.g. a PR branch), which wouldn't otherwise be
        # reachable for `git rev-parse`/`git worktree add` below. This repo
        # has no forks in play here (workflow_dispatch is already
        # write-access-gated), so fetching every branch ref directly is
        # safe and simple.
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Resolve inputs and write metadata.json
        id: meta
        run: |
          set -euo pipefail
          # Prefer origin/<input> (handles a plain branch name unambiguously,
          # since a same-named local ref left over from checkout could
          # otherwise shadow it); fall back to the raw input (handles a bare
          # SHA or tag, which have no origin/ prefix form).
          #
          # --verify -q is required on the first attempt: plain `git
          # rev-parse origin/<bare-sha>` still prints the raw argument to
          # stdout as a "maybe a pathspec" fallback even though it exits
          # non-zero, and since only stderr is redirected away here, that
          # stray line concatenates with the second attempt's real output
          # inside $(...). --verify -q makes a failed lookup print nothing
          # and exit 1 cleanly.
          resolve_ref() {
            git rev-parse --verify -q "origin/$1" 2>/dev/null || git rev-parse --verify "$1"
          }
          BASE_SHA=$(resolve_ref "$BASE_SHA_INPUT")
          CANDIDATE_SHA=$(resolve_ref "$CANDIDATE_SHA_INPUT")
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

          # Reject a candidate that doesn't build on top of base unless
          # explicitly overridden. Without this, a candidate built from a
          # stale/diverged base can silently lack an option (or feature)
          # base has, or vice versa -- run 31362228815 compared a
          # post-PR#18 base (has the SpecTopN USI option) against a
          # pre-PR#18 candidate (doesn't), so the requested SpecTopN=0 was
          # never actually applied on the candidate side, producing a
          # bogus 238x node-count outlier that had nothing to do with the
          # qsearch-TT change under test.
          if git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"; then
            BASE_IS_ANCESTOR=true
          else
            BASE_IS_ANCESTOR=false
          fi
          if [ "$BASE_IS_ANCESTOR" = "false" ] && [ "$ALLOW_NON_ANCESTOR" != "true" ]; then
            echo "CANDIDATE_NOT_BASED_ON_BASE: candidate $CANDIDATE_SHA does not have base $BASE_SHA as an ancestor -- this would compare mixed vintages rather than an isolated diff. Pass allow_non_ancestor=true to override for a deliberate independent-commit comparison." >&2
            exit 1
          fi

          mkdir -p artifacts
          CORPUS_HASH=$(sha256sum "$CORPUS_PATH" | cut -d' ' -f1)
          RUSTC_VERSION=$(rustc --version)
          UTC_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # base_input/candidate_input/candidate_pr are free-text
          # workflow_dispatch inputs (unlike the hex SHAs/digests below,
          # not guaranteed quote/backslash-free) -- built via python's json
          # module rather than a bash heredoc so they can't corrupt the
          # JSON output the way the unescaped resolve_ref() bug did.
          BASE_SHA="$BASE_SHA" CANDIDATE_SHA="$CANDIDATE_SHA" \
          BASE_IS_ANCESTOR="$BASE_IS_ANCESTOR" CORPUS_HASH="$CORPUS_HASH" \
          RUSTC_VERSION="$RUSTC_VERSION" UTC_START="$UTC_START" \
          python3 -c '
          import json, os

          meta = {
              "base_input": os.environ["BASE_SHA_INPUT"],
              "base_sha": os.environ["BASE_SHA"],
              "candidate_input": os.environ["CANDIDATE_SHA_INPUT"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "candidate_pr": os.environ.get("CANDIDATE_PR") or None,
              "base_is_ancestor_of_candidate": os.environ["BASE_IS_ANCESTOR"] == "true",
              "depth": int(os.environ["DEPTH"]),
              "threads": int(os.environ["THREADS"]),
              "spec_top_n": int(os.environ["SPEC_TOP_N"]),
              "repeats": int(os.environ["REPEATS"]),
              "corpus_path": os.environ["CORPUS_PATH"],
              "corpus_sha256": os.environ["CORPUS_HASH"],
              "rustc_version": os.environ["RUSTC_VERSION"],
              "workflow_run_id": os.environ["RUN_ID"],
              "utc_start": os.environ["UTC_START"],
              # SHA of the ref this workflow file itself ran from --
              # distinct from base_sha/candidate_sha (the engine source
              # under comparison). Dispatching --ref <gate-tooling-branch>
              # runs the workflow/script versions from that branch
              # against engine SHAs that usually live elsewhere.
              "gate_tooling_sha": os.environ["GATE_TOOLING_SHA"],
          }
          with open("artifacts/metadata.json", "w") as f:
              json.dump(meta, f, indent=2)
          '
          cat artifacts/metadata.json

      - name: Build base in its own worktree
        run: |
          set -euo pipefail
          BASE_SHA="${{ steps.meta.outputs.base_sha }}"
          git worktree add /tmp/base-checkout "$BASE_SHA"
          cargo build --release --manifest-path /tmp/base-checkout/Cargo.toml -p sekirei
          sha256sum /tmp/base-checkout/target/release/sekirei | tee artifacts/base_binary_sha256.txt

      - name: Run base corpus (single-shot)
        if: ${{ inputs.repeats == '1' }}
        run: |
          set -euo pipefail
          python3 scripts/run_fixed_depth_ab.py run \
            --binary /tmp/base-checkout/target/release/sekirei \
            --corpus "$CORPUS_PATH" \
            --depth "$DEPTH" \
            --threads "$THREADS" \
            --spec-top-n "$SPEC_TOP_N" \
            --output artifacts/base_results.json \
            --label base

      - name: Run base repeatability
        if: ${{ inputs.repeats != '1' }}
        run: |
          set -euo pipefail
          python3 scripts/run_fixed_depth_ab.py repeat \
            --binary /tmp/base-checkout/target/release/sekirei \
            --corpus "$CORPUS_PATH" \
            --depth "$DEPTH" \
            --threads "$THREADS" \
            --spec-top-n "$SPEC_TOP_N" \
            --repeats "$REPEATS" \
            --output artifacts/base_repeat.json \
            --label base
          python3 scripts/run_fixed_depth_ab.py analyze-repeatability \
            --input artifacts/base_repeat.json \
            --output artifacts/base_repeatability_metrics.json

      - name: Build candidate in its own worktree
        run: |
          set -euo pipefail
          CANDIDATE_SHA="${{ steps.meta.outputs.candidate_sha }}"
          git worktree add /tmp/candidate-checkout "$CANDIDATE_SHA"
          cargo build --release --manifest-path /tmp/candidate-checkout/Cargo.toml -p sekirei
          sha256sum /tmp/candidate-checkout/target/release/sekirei | tee artifacts/candidate_binary_sha256.txt

      - name: Run candidate corpus (single-shot)
        if: ${{ inputs.repeats == '1' }}
        run: |
          set -euo pipefail
          python3 scripts/run_fixed_depth_ab.py run \
            --binary /tmp/candidate-checkout/target/release/sekirei \
            --corpus "$CORPUS_PATH" \
            --depth "$DEPTH" \
            --threads "$THREADS" \
            --spec-top-n "$SPEC_TOP_N" \
            --output artifacts/candidate_results.json \
            --label candidate

      - name: Run candidate repeatability
        if: ${{ inputs.repeats != '1' }}
        run: |
          set -euo pipefail
          python3 scripts/run_fixed_depth_ab.py repeat \
            --binary /tmp/candidate-checkout/target/release/sekirei \
            --corpus "$CORPUS_PATH" \
            --depth "$DEPTH" \
            --threads "$THREADS" \
            --spec-top-n "$SPEC_TOP_N" \
            --repeats "$REPEATS" \
            --output artifacts/candidate_repeat.json \
            --label candidate
          python3 scripts/run_fixed_depth_ab.py analyze-repeatability \
            --input artifacts/candidate_repeat.json \
            --output artifacts/candidate_repeatability_metrics.json

      - name: Compare (single-shot)
        if: ${{ inputs.repeats == '1' }}
        run: |
          python3 scripts/run_fixed_depth_ab.py compare \
            --base artifacts/base_results.json \
            --candidate artifacts/candidate_results.json \
            --output-dir artifacts

      - name: Compare repeatability
        if: ${{ inputs.repeats != '1' }}
        run: |
          python3 scripts/run_fixed_depth_ab.py compare-repeatability \
            --base artifacts/base_repeatability_metrics.json \
            --candidate artifacts/candidate_repeatability_metrics.json \
            --output-dir artifacts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-depth-ab-${{ github.run_id }}
          path: artifacts/
          retention-days: 90
