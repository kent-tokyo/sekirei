# NNUE weight provenance registry — Sekirei
#
# Generated 2026-07-24 (Sprint 1 / Phase A1 provenance audit). One entry per
# promoted `data/weights_*.bin` milestone, plus one entry per distinct
# training-run "arm" under `data/runs/` (not per individual epoch checkpoint
# — 315 raw .bin files exist on disk, most are per-epoch snapshots of the
# same run; this registry tracks the ~30 distinct things that were actually
# trained/compared, each noting which epoch was selected as final/best).
#
# `data/` is entirely gitignored (see data/README.md) — training artifacts
# have no git history of their own. This registry is placed under `docs/`
# instead of `data/weights/registry.toml` (the location suggested in the
# Sprint 1 spec) specifically so the registry ITSELF is git-tracked and has
# a diff history — a provenance record that could be silently edited with
# no trace would defeat much of its own purpose. `data/README.md` (human-
# facing, untracked like the rest of data/) points here.
#
# sha256/size/magic below were computed directly against the files on disk
# during this audit (2026-07-24), not copied from any training-time log.
# `zero_init_collapsed` was verified directly too: parses each file's raw
# bytes and checks whether FT row 0 / L2 row 0 / out have variance exactly
# 0.0 — the signature of the pre-2026-07-11 zero-init bug (commit 0cac38e,
# "fix(train): seed weight init to break symmetry collapse"). Any field
# below marked "unknown" means no train.log/manifest.json/*.meta.json/doc
# was found stating it — never inferred from a filename or mtime.
#
# Architecture is identical across every file that loads at all (fixed at
# compile time, not stored per-file): INPUT=2420 (piece-square x14 kinds x2
# perspectives = 2268, + 38 hand-count thresholds x4 = 152), FT(L1)=256 per
# perspective, L2=32. `file_format_version` = the 8-byte magic string.

schema_version = 1
generated = "2026-07-24"
architecture_note = "Identical for every entry below: INPUT=2420, FT(L1)=256/perspective, L2=32 (PS+hand features). See crates/sekirei-core/src/nnue.rs module doc."

